name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: ./scripts/fetch-pdfium.sh x86_64-unknown-linux-gnu

      - run: npm run tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: path-pdf-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  build-windows:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: fetch PDFium
        shell: bash
        run: ./scripts/fetch-pdfium.sh x86_64-pc-windows-msvc

      - run: npm run tauri build

      - name: upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: path-pdf-windows-unsigned
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  sign-windows:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: pick signing policy
        id: policy
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "slug=release-signing" >> "$GITHUB_OUTPUT"
          else
            echo "slug=test-signing" >> "$GITHUB_OUTPUT"
          fi

      # Skipped (not failed) until SignPath Foundation approval lands and
      # SIGNPATH_API_TOKEN/SIGNPATH_ORGANIZATION_ID/SIGNPATH_PROJECT_SLUG
      # are added as repo secrets/variables -- see README.md. Until then,
      # the unsigned `path-pdf-windows-unsigned` artifact from build-windows
      # is what you download and copy to a test machine.
      - name: submit signing request
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ steps.policy.outputs.slug }}
          github-artifact-id: ${{ needs.build-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: upload signed installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: path-pdf-windows-signed
          path: signed
