[package]
name = "path-pdf"
version = "0.1.0"
description = "A fast, lightweight PDF viewer and light editor"
authors = ["Solid Path Apps"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
# Default features already include thread_safe (Mutex-guarded access, needed
# since Tauri commands run off a thread pool) and image-crate interop (used
# to pull RGBA bytes + dimensions out of a rendered page).
pdfium-render = "0.8"
thiserror = "2"
# Same major.minor as pdfium-render's own "image_025" feature -- needed
# directly (not just transitively) to decode uploaded signature PNG bytes
# into the DynamicImage type PdfPageObjectsCommon::create_image_object expects.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Desktop-only (not available on mobile, hence the target-specific section
# below): focuses the existing window and opens the new file instead of
# launching a second window when the OS starts the app a second time, e.g.
# double-clicking another PDF while Path PDF is already running.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# DwmSetWindowAttribute (DWMWA_USE_IMMERSIVE_DARK_MODE /
# DWMWA_TRANSITIONS_FORCEDISABLED), called directly on the main window's raw
# HWND right after creation -- see "startup titlebar flash" in src/lib.rs.
# Version pinned to match what tauri itself already depends on for its own
# Windows-specific code (see tauri's Cargo.toml), so this doesn't pull in a
# second copy of the windows crate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
