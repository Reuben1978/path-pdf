    <!-- Splash styles are inline and the markup below is static, so the
         very first frame this window paints is already the branded splash.
         This replaced a separate always-on-top splash *window*: with two
         windows there was always some instant where neither fully covered
         the screen (desktop showed through) or where the main window was
         visible but had not painted its content yet (it popped in). A
         webview cannot paint while its window is hidden, so no amount of
         "wait until ready, then show" ordering could fix that. One window
         that is never blank sidesteps the whole problem. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      /* Absolute + width/height:100% rather than position:fixed + inset:0.
         Fixed positioning resolves against this webview's reported
         viewport, which measured narrower than the actual window and left
         the splash (and so the centred logo) sitting well left of centre.
         Normal-flow percentages fill the window correctly -- the app's own
         layout below already proves that. */
      #splash {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        background: #17151d;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 250ms ease;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      /* Fixed px, no viewport units: this webview has been unreliable about
         resolving vw/vmin against the real window size, and a bad value
         here renders the logo invisibly small on an all-black splash.
         The image itself is an inline data URI rather than a file so it
         needs no separate request and is guaranteed to be part of this
         document's first paint -- as a linked file it did not render at
         all during the splash. */
      #splash img {
        width: 440px;
        max-width: 80%;
        height: auto;
      }
    </style>
